services:
  - type: web
    name: movie-recommender
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd app && streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: GIT_LFS_ENABLED
        value: true
      - key: PYTHON_VERSION
        value: 3.14.3
